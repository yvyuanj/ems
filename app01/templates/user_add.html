{% extends "layout.html" %}
{# 新增用户页：各字段输入 + 部门下拉 #}
{% block content %}
<div class="panel">
    <div class="panel-title">新建用户</div>
    <div class="form-body">
        <form method="post">
            {% csrf_token %}
            {# 用户各字段输入框，name 对应视图 request.POST 取值 #}
            <div class="form-row">
                <label>姓名</label>
                <input type="text" name="name" placeholder="请输入姓名" required>
            </div>
            <div class="form-row">
                <label>密码</label>
                <input type="text" name="password" placeholder="请输入密码" required>
            </div>
            <div class="form-row">
                <label>年龄</label>
                <input type="number" name="age" placeholder="请输入年龄" required>
            </div>
            <div class="form-row">
                <label>账户余额</label>
                <input type="number" step="0.01" max="99999999.99" name="account" placeholder="0.00" required>
            </div>
            <div class="form-row">
                <label>入职时间</label>
                <input type="datetime-local" name="create_time" required>
            </div>
            <div class="form-row">
                <label>性别</label>
                <select name="gender">
                    <option value="1">男</option>
                    <option value="2">女</option>
                </select>
            </div>
            {# 部门下拉：循环所有部门生成选项 #}
            <div class="form-row">
                <label>所属部门</label>
                <select name="depart_id">
                    {% for d in depart_list %}
                    <option value="{{ d.id }}">{{ d.title }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-success">提 交</button>
        </form>
    </div>
</div>
{% endblock %}
