<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>部门列表</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "微软雅黑", Arial, sans-serif; background: #f4f6f9; color: #333; }
        a { text-decoration: none; }
        .navbar {
            background: #fff; border-bottom: 1px solid #e6e8eb;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
            display: flex; align-items: center; padding: 0 24px; height: 56px;
            position: relative; z-index: 100;
        }
        .brand { font-size: 20px; font-weight: 700; color: #1f2d3d; margin-right: 36px; }
        .nav-menu { display: flex; align-items: center; gap: 6px; }
        .nav-item { position: relative; }
        .nav-link { display: block; padding: 10px 16px; color: #3a4552; font-size: 15px; border-radius: 4px; }
        .nav-link:hover { background: #eef2f7; color: #1890ff; }
        .nav-link .caret { font-size: 11px; margin-left: 4px; color: #9aa5b1; }
        .dropdown {
            display: none; position: absolute; top: 100%; left: 0; min-width: 150px;
            background: #fff; border: 1px solid #e6e8eb; border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 6px 0;
        }
        .nav-item:hover .dropdown { display: block; }
        .dropdown a { display: block; padding: 9px 18px; color: #3a4552; font-size: 14px; }
        .dropdown a:hover { background: #f0f6ff; color: #1890ff; }
        .dropdown .divider { height: 1px; background: #eee; margin: 6px 0; }
        .nav-user { margin-left: auto; position: relative; display: flex; align-items: center; gap: 10px; }
        .nav-user .login-link { color: #3a4552; font-size: 15px; }
        .nav-user .login-link:hover { color: #1890ff; }
        .user-toggle { cursor: pointer; color: #3a4552; font-size: 15px; padding: 10px 4px; }
        .nav-user:hover .dropdown { display: block; }
        .nav-user .dropdown { right: 0; left: auto; }

        .container { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
        .panel { background: #fff; border: 1px solid #e6e8eb; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
        .btn { display: inline-block; border: none; border-radius: 4px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
        .btn:hover { opacity: .85; }
        .btn-success { background: #34b950; color: #fff; }
        .btn-edit { background: #2b7bcc; color: #fff; padding: 4px 12px; font-size: 13px; }
        .btn-del { background: #dd3737; color: #fff; padding: 4px 12px; font-size: 13px; }
        .panel-body { padding: 16px; }
        .table-title { padding: 10px 16px; background: #f7f8fa; border-bottom: 1px solid #e6e8eb; font-size: 15px; }
        table { width: 100%; border-collapse: collapse; }
        table th, table td { padding: 10px 16px; text-align: left; border-bottom: 1px solid #eef0f2; font-size: 14px; }
        table thead th { background: #fafbfc; color: #606a76; font-weight: 600; border-bottom: 1px solid #e6e8eb; }
        table tbody tr:hover { background: #f7faff; }
    </style>
</head>
<body>

<nav class="navbar">
    <span class="brand">联通用户管理系统</span>
    <div class="nav-menu">
        <div class="nav-item">
            <a class="nav-link" href="/depart/list/">部门管理<span class="caret">▾</span></a>
            <div class="dropdown">
                <a href="/depart/list/">部门列表</a>
                <a href="/depart/add/">新建部门</a>
            </div>
        </div>
        <div class="nav-item">
            <a class="nav-link" href="#">用户管理<span class="caret">▾</span></a>
            <div class="dropdown">
                <a href="#">用户列表</a>
                <a href="#">新建用户</a>
            </div>
        </div>
        <div class="nav-item">
            <a class="nav-link" href="#">Link<span class="caret">▾</span></a>
            <div class="dropdown">
                <a href="#">链接一</a>
                <a href="#">链接二</a>
            </div>
        </div>
    </div>
    <div class="nav-user">
        <a class="login-link" href="#">登录</a>
        <span class="user-toggle">余远杰 ▾</span>
        <div class="dropdown">
            <a href="#">个人资料</a>
            <a href="#">我的信息</a>
            <div class="divider"></div>
            <a href="#">注销</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="panel">
        <div class="panel-body">
            <a class="btn btn-success" href="/depart/add/">➕ 新建部门</a>
        </div>
        <div class="table-title">▦ 部门列表</div>
        <table>
            <thead>
            <tr><th>ID</th><th>名称</th><th>操作</th></tr>
            </thead>
            <tbody>
            {% for obj in depart_list %}
            <tr>
                <td>{{ obj.id }}</td>
                <td>{{ obj.title }}</td>
                <td>
                    <a href="/depart/{{ obj.id }}/edit/"><button class="btn btn-edit">编辑</button></a>
                    <a href="/depart/delete/?nid={{ obj.id }}" onclick="return confirm('确定删除？')"><button class="btn btn-del">删除</button></a>
                </td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
